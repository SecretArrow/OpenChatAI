name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish APK release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (debug-signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/app-release.apk apks/OpenChatAI-release.apk

      - name: Package runtime packs (per-ABI)
        run: |
          mkdir -p packs
          for ABI in arm64-v8a x86_64; do
            STAGE="packs/runtime-llama-cpu-$ABI"
            mkdir -p "$STAGE"
            unzip -o -q apks/OpenChatAI-release.apk "lib/$ABI/*" -d "$STAGE"
            # Rapikan: pindahkan isi lib/<abi>/* ke root stage agar zip berisi .so di root
            if [ -d "$STAGE/lib/$ABI" ]; then
              mv "$STAGE"/lib/$ABI/* "$STAGE"/
              rm -rf "$STAGE/lib"
            fi
            (cd "$STAGE" && zip -q -r "../../apks/runtime-llama-cpu-$ABI.zip" .)
          done
          ls -la apks/

      # Commit manifest menambah 1 commit ke main SETELAH tag dibuat — perilaku ini
      # disengaja & terdokumentasi di sini. Push memakai kredensial default
      # checkout@v4 (GITHUB_TOKEN, persist-credentials: true) dan TIDAK memicu
      # workflow lain (diinginkan). Aplikasi membaca manifest ini dari:
      # https://raw.githubusercontent.com/SecretArrow/OpenChatAI/main/runtime/manifest.json
      - name: Generate & publish runtime manifest
        if: startsWith(github.ref_name, 'v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p runtime
          python3 - <<'PY'
          import hashlib, json, os
          tags = os.environ["TAG_NAME"]
          version = tags[1:] if tags.startswith("v") else tags
          packs = []
          for abi in ["arm64-v8a", "x86_64"]:
              p = f"apks/runtime-llama-cpu-{abi}.zip"
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              packs.append({
                  "id": f"llama-cpu-{abi}",
                  "kind": "RUNTIME",
                  "name": f"llama.cpp CPU ({abi})",
                  "version": version,
                  "abi": abi,
                  "feature": "local-inference",
                  "required": False,
                  "sizeBytes": os.path.getsize(p),
                  "sha256": h.hexdigest(),
                  "url": f"https://github.com/SecretArrow/OpenChatAI/releases/download/{tags}/runtime-llama-cpu-{abi}.zip",
                  "description": "libopenchai_llama.so (llama.cpp b10919, ggml statis) dari rilis " + tags + " — diperbarui tanpa memperbarui APK."
              })
          manifest = {"schema": 1, "version": version, "packs": packs}
          with open("runtime/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          if git diff --quiet -- runtime/manifest.json 2>/dev/null && git ls-files --error-unmatch runtime/manifest.json >/dev/null 2>&1; then
            echo "Manifest tidak berubah — lewati commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add runtime/manifest.json
            git commit -m "chore: update runtime manifest for ${TAG_NAME}"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Open Chat AI ${{ github.ref_name }}
          body: |
            ## Open Chat AI

            AI Coding Agent chat application for Android.

            **Install:** download `OpenChatAI-release.apk` and install it
            (allow "Install unknown apps" for your browser/file manager).

            ### Highlights
            - **AI on-device**: llama.cpp embedded (JNI) — GGUF models (Qwen, Llama, Gemma, Phi) download & run fully offline, no other app needed
            - **MCP (Model Context Protocol)** client: streamable HTTP + SSE + stdio, tools exposed to the agent
            - **Skills**: builtin + user-defined skill packs auto-injected into the agent prompt
            - Chat-first AI coding agent UI (Jetpack Compose, Material 3)
            - OpenCode engine integration (server mode) with built-in sandboxed agent fallback
            - Ollama (local/remote), OpenAI, Anthropic, Google & custom OpenAI-compatible providers
            - Embedded Linux terminal (hidden by default) with background process manager
            - Encrypted API key storage, workspace sandbox, light/dark theme

            ### Runtime packs
            - `runtime-llama-cpu-arm64-v8a.zip` / `runtime-llama-cpu-x86_64.zip`: libopenchai_llama.so per-ABI — bisa dipasang/hapus langsung dari aplikasi (Models → Runtime & Modul), mendukung jeda/lanjut unduhan. Manifest: `runtime/manifest.json` (di-commit ke main oleh workflow ini).

            > APK is signed with a debug key for convenience. Build your own
            > release keystore before public distribution.
          files: |
            apks/OpenChatAI-release.apk
            apks/runtime-llama-cpu-*.zip
          make_latest: true
